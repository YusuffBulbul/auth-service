server:
  port: 8085

spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/authdb}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

info:
  app:
    name: Auth Service
    description: Authentication and JWT service for Task Management System
    version: 0.0.1

app:
  jwt:
    secret: ${JWT_SECRET:task-management-development-jwt-secret-key-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}